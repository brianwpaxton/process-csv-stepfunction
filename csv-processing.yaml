AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Simple S3 CSV processing demonstration using EventBridge,
  Step Functions Distributed Map and Lambda.

Resources:

  # ============================================================
  # S3 bucket
  # ============================================================

  CsvBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  # ============================================================
  # Lambda execution role
  # ============================================================

  ProcessRowLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole


  # ============================================================
  # CloudWatch log group for Lambda
  # ============================================================

  ProcessRowLambdaLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessRowLambda}"
      RetentionInDays: 7


  # ============================================================
  # Lambda - processes one CSV row
  # ============================================================

  ProcessRowLambda:
    Type: AWS::Lambda::Function

    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler

      Role: !GetAtt ProcessRowLambdaRole.Arn

      Timeout: 30

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):

              print("Processing CSV row:")
              print(json.dumps(event))

              row_id = str(event.get("id", ""))

              # Simulate an API failure for selected rows.
              if row_id in ["3", "5"]:
                  print(f"Simulating API failure for row {row_id}")
                  raise Exception(
                      f"Simulated API failure for row {row_id}"
                  )

              # Simulate successful API call.
              print(f"Simulated API call succeeded for row {row_id}")

              return {
                  "status": "SUCCESS",
                  "row": event
              }


  # ============================================================
  # Step Functions execution role
  # ============================================================

  CsvStateMachineRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - states.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        # --------------------------------------------------------
        # Allow Step Functions to read CSV files from S3
        # --------------------------------------------------------

        - PolicyName: ReadCsvFromS3

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion

                Resource:
                  - !Sub "${CsvBucket.Arn}/input/*"

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !GetAtt CsvBucket.Arn

                Condition:
                  StringLike:
                    s3:prefix:
                      - input/*


        # --------------------------------------------------------
        # Allow Step Functions to invoke Lambda
        # --------------------------------------------------------

        - PolicyName: InvokeRowLambda

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - lambda:InvokeFunction

                Resource:
                  - !GetAtt ProcessRowLambda.Arn


        # --------------------------------------------------------
        # Permissions required by Distributed Map
        # --------------------------------------------------------

        - PolicyName: DistributedMap

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - states:StartExecution

                Resource:
                  - !GetAtt CsvStateMachine.Arn

              - Effect: Allow

                Action:
                  - states:DescribeExecution

                Resource:
                  - !Sub
                    arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-CsvProcessor:*


  # ============================================================
  # Step Functions state machine
  # ============================================================

  CsvStateMachine:
    Type: AWS::StepFunctions::StateMachine

    Properties:

      StateMachineType: STANDARD

      StateMachineName: !Sub "${AWS::StackName}-CsvProcessor"

      RoleArn: !GetAtt CsvStateMachineRole.Arn

      DefinitionString: !Sub |
        {
          "Comment": "Process each row in a CSV file from S3",

          "StartAt": "Process CSV",

          "States": {

            "Process CSV": {
              "Type": "Map",

              "ItemReader": {
                "Resource": "arn:aws:states:::s3:getObject",

                "ReaderConfig": {
                  "InputType": "CSV",
                  "CSVHeaderLocation": "FIRST_ROW"
                },

                "Parameters": {
                  "Bucket.$": "$.bucket",
                  "Key.$": "$.key"
                }
              },

              "ItemProcessor": {

                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "STANDARD"
                },

                "StartAt": "Process Row",

                "States": {

                  "Process Row": {

                    "Type": "Task",

                    "Resource": "arn:aws:states:::lambda:invoke",

                    "Parameters": {
                      "FunctionName": "${ProcessRowLambda.Arn}",
                      "Payload.$": "$"
                    },

                    "ResultPath": "$.apiResult",

                    "Catch": [
                      {
                        "ErrorEquals": [
                          "States.ALL"
                        ],

                        "ResultPath": "$.error",

                        "Next": "Row Failed"
                      }
                    ],

                    "Next": "Row Succeeded"
                  },


                  "Row Succeeded": {

                    "Type": "Pass",

                    "Parameters": {
                      "status": "SUCCESS",
                      "row.$": "$"
                    },

                    "End": true
                  },


                  "Row Failed": {

                    "Type": "Pass",

                    "Parameters": {
                      "status": "FAILED",
                      "row.$": "$",
                      "error.$": "$.error"
                    },

                    "End": true
                  }
                }
              },

              "End": true
            }
          }
        }


  # ============================================================
  # EventBridge role
  # ============================================================

  EventBridgeStepFunctionsRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: StartCsvStateMachine

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - states:StartExecution

                Resource:
                  - !GetAtt CsvStateMachine.Arn


  # ============================================================
  # EventBridge rule
  # ============================================================

  CsvUploadRule:
    Type: AWS::Events::Rule

    Properties:

      Description: >
        Start CSV processing when a CSV file is uploaded
        to the input prefix.

      EventPattern:

        source:
          - aws.s3

        detail-type:
          - Object Created

        detail:

          bucket:
            name:
              - !Ref CsvBucket

          object:

            key:
              - prefix: input/
              - suffix: .csv

      State: ENABLED

      Targets:

        - Id: StartCsvStateMachine

          Arn: !GetAtt CsvStateMachine.Arn

          RoleArn: !GetAtt EventBridgeStepFunctionsRole.Arn

          InputTransformer:

            InputPathsMap:

              bucket: "$.detail.bucket.name"

              key: "$.detail.object.key"

            InputTemplate: |
              {
                "bucket": "<bucket>",
                "key": "<key>"
              }


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  CsvBucketName:

    Description: S3 bucket for CSV uploads

    Value: !Ref CsvBucket


  UploadLocation:

    Description: Upload CSV files to this location

    Value: !Sub "s3://${CsvBucket}/input/"


  ResultsNote:

    Description: >
      Currently processing results are visible in the Step
      Functions execution history. No result file is generated.

    Value: "See Step Functions execution details"


  StateMachineArn:

    Description: Step Functions state machine ARN

    Value: !GetAtt CsvStateMachine.Arn


  LambdaArn:

    Description: Lambda used to process individual CSV rows

    Value: !GetAtt ProcessRowLambda.Arn